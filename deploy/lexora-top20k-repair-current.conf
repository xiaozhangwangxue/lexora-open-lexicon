[Unit]
Conflicts=

[Service]
EnvironmentFile=/opt/lexora/deployments/repair/current/candidate.env
ExecStart=
ExecStartPre=+/opt/lexora/deployments/repair/current/deploy/repair_collector_state.sh capture %i
ExecStartPre=/usr/bin/python3 /opt/lexora/deployments/repair/current/deploy/preflight_repair_queue.py --dataset /opt/lexora/build/lexora-open-oxford-scope.sqlite --repair-queue /opt/lexora/deployments/repair/current/build/lexora-open-oxford-safe-20k.sqlite --shard-index %i --shard-count 2 --tools /opt/lexora/deployments/repair/current/tools
ExecStart=/usr/bin/python3 /opt/lexora/deployments/repair/current/tools/enrich_oxford_scope.py --dataset /opt/lexora/build/lexora-open-oxford-scope.sqlite --state /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/repair-shard-%i.sqlite --repair-queue /opt/lexora/deployments/repair/current/build/lexora-open-oxford-safe-20k.sqlite --shard-index %i --shard-count 2 --profile core --quality-repair-only --workers 8 --delay 16 --translation-delay 16 --retry-after-hours 0
ExecStopPost=
ExecStopPost=+/opt/lexora/deployments/repair/current/deploy/repair_collector_state.sh restore %i
