[Unit]
Conflicts=

[Service]
EnvironmentFile=/opt/lexora/deployments/repair/current/candidate.env
ExecStart=
ExecStartPre=+/opt/lexora/deployments/repair/current/deploy/repair_collector_state.sh capture %i
ExecStartPre=+/usr/bin/rm -f /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/preflight-shard-%i.json
ExecStartPre=+/usr/bin/rm -f /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/runtime-ready-shard-%i.json
ExecStart=/usr/bin/python3 /opt/lexora/deployments/repair/current/tools/enrich_oxford_scope.py --dataset /opt/lexora/build/lexora-open-oxford-scope.sqlite --state /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/repair-shard-%i.sqlite --repair-queue /opt/lexora/deployments/repair/current/build/lexora-open-oxford-safe-20k.sqlite --shard-index %i --shard-count 2 --profile core --quality-repair-only --workers 8 --delay 16 --translation-delay 16 --retry-after-hours 0 --release-id ${LEXORA_RELEASE_ID} --preflight-marker /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/preflight-shard-%i.json --ready-marker /opt/lexora/state/fast20k/${LEXORA_CANDIDATE_DIGEST}/runtime-ready-shard-%i.json
ExecStopPost=
ExecStopPost=+/opt/lexora/deployments/repair/current/deploy/repair_collector_state.sh restore %i
