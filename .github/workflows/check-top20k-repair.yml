name: Check top-20k repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 140.245.114.238
            shard: 0
          - host: 134.185.82.7
            shard: 1
    steps:
      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LEXORA_OCI_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LEXORA_OCI_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lexora_oci
          chmod 0600 ~/.ssh/lexora_oci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Read repair and snapshot service status
        shell: bash
        run: |
          timeout 360s ssh -i ~/.ssh/lexora_oci -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 "opc@${{ matrix.host }}" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "repair_state=$(systemctl is-active lexora-top20k-repair@'${{ matrix.shard }}'.service || true)"
          echo "collector_state=$(systemctl is-active lexora-enrich-micro@'${{ matrix.shard }}'.service || true)"
          echo "timer_state=$(systemctl is-enabled lexora-top20k-repair@'${{ matrix.shard }}'.timer || true)"
          systemctl show lexora-top20k-repair@'${{ matrix.shard }}'.service \
            -p MainPID -p ActiveState -p SubState -p Result
          systemctl list-timers \
            lexora-top20k-repair@'${{ matrix.shard }}'.timer --no-pager || true
          quality=lexora-top20k-quality-snapshot@'${{ matrix.shard }}'.service
          systemctl show "$quality" \
            -p Id -p MainPID -p Job -p ActiveState -p SubState -p Result \
            -p ExecMainCode -p ExecMainStatus -p ActiveEnterTimestamp \
            -p InactiveEnterTimestamp -p TimeoutStartUSec
          systemctl list-jobs --no-pager || true
          ls -l --time-style=full-iso \
            /opt/lexora/state/top20k-quality-shard-'${{ matrix.shard }}'.json \
            2>/dev/null || echo "quality_snapshot=missing"
          timeout 10s journalctl -u "$quality" -n 80 --no-pager || true
          if [[ '${{ matrix.shard }}' == 0 && \
                ! -s /opt/lexora/state/top20k-quality-shard-0.json ]]; then
            # The old quality unit is ordered after the much heavier full
            # progress scan.  Cancel only those read-only monitoring jobs,
            # then create the missing atomic snapshot directly.  Neither the
            # repair writer nor the collector is touched.
            sudo systemctl stop "$quality" || true
            sudo systemctl stop lexora-progress-snapshot@0.service || true
            timeout 300s nice -n 10 ionice -c 2 -n 7 \
              python3 /opt/lexora/tools/write_top20k_quality_snapshot.py \
                --dataset /opt/lexora/build/lexora-open-oxford-scope.sqlite \
                --output /opt/lexora/state/top20k-quality-shard-0.json \
                --shard-index 0 --shard-count 2 --unresolved-limit 8
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/opt/lexora/state/top20k-quality-shard-0.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["shardIndex"] == 0
          assert value["total"] == 13044
          assert value["complete"] + value["incomplete"] == value["total"]
          print(json.dumps({
              "snapshot": str(path),
              "complete": value["complete"],
              "total": value["total"],
          }, sort_keys=True))
          PY
          fi
          timeout 10s journalctl -u lexora-top20k-repair@'${{ matrix.shard }}'.service \
            -n 12 --no-pager || echo "journal=busy_or_timed_out"
          REMOTE
