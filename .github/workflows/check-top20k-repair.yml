name: Check top-20k repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 140.245.114.238
            shard: 0
          - host: 134.185.82.7
            shard: 1
    steps:
      - name: Prepare SSH credentials
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LEXORA_OCI_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LEXORA_OCI_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lexora_oci
          chmod 0600 ~/.ssh/lexora_oci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Read repair status and quality
        shell: bash
        run: |
          timeout 360s ssh -i ~/.ssh/lexora_oci -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 "opc@${{ matrix.host }}" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "repair_state=$(systemctl is-active lexora-top20k-repair@'${{ matrix.shard }}'.service || true)"
          echo "collector_state=$(systemctl is-active lexora-enrich-micro@'${{ matrix.shard }}'.service || true)"
          echo "timer_state=$(systemctl is-enabled lexora-top20k-repair@'${{ matrix.shard }}'.timer || true)"
          systemctl show lexora-top20k-repair@'${{ matrix.shard }}'.service \
            -p MainPID -p ActiveState -p SubState -p Result
          systemctl list-timers \
            lexora-top20k-repair@'${{ matrix.shard }}'.timer --no-pager || true
          echo "database_diagnostics_begin=$(date -u +%FT%TZ)"
          database=/opt/lexora/build/lexora-open-oxford-scope.sqlite
          stat --printf='database_bytes=%s database_mtime=%y\n' "$database"
          for sidecar in "$database-wal" "$database-shm"; do
            if [ -e "$sidecar" ]; then
              stat --printf='sidecar=%n bytes=%s mtime=%y\n' "$sidecar"
            fi
          done
          df -B1 --output=size,used,avail,pcent,target /opt/lexora/build
          du -s -B1 /opt/lexora/build
          find /tmp -maxdepth 1 -type d -name 'lexora-safe-*' \
            -printf 'temporary_snapshot_dir=%p\n' 2>/dev/null || true
          python3 - "$database" <<'PY'
          import json
          import sqlite3
          import sys

          path = sys.argv[1]
          database = sqlite3.connect(f"file:{path}?mode=ro", uri=True, timeout=30)
          try:
              result = {
                  "pageSize": database.execute("PRAGMA page_size").fetchone()[0],
                  "pageCount": database.execute("PRAGMA page_count").fetchone()[0],
                  "freePages": database.execute("PRAGMA freelist_count").fetchone()[0],
                  "journalMode": database.execute("PRAGMA journal_mode").fetchone()[0],
              }
              count, minimum, maximum = database.execute(
                  "SELECT count(*), min(id), max(id) FROM entries"
              ).fetchone()
              result.update({"rows": count, "minId": minimum, "maxId": maximum})
              print("database_sqlite=" + json.dumps(result, sort_keys=True))
          finally:
              database.close()
          PY
          echo "database_diagnostics_end=$(date -u +%FT%TZ)"
          echo "quality_report_begin=$(date -u +%FT%TZ)"
          timeout 300s python3 /opt/lexora/tools/top20k_quality.py \
            --dataset /opt/lexora/build/lexora-open-oxford-scope.sqlite \
            --shard-index '${{ matrix.shard }}' --shard-count 2 \
            --unresolved-limit 200 --json || \
            echo "quality_report=busy_or_timed_out"
          echo "quality_report_end=$(date -u +%FT%TZ)"
          timeout 10s journalctl -u lexora-top20k-repair@'${{ matrix.shard }}'.service \
            -n 12 --no-pager || echo "journal=busy_or_timed_out"
          REMOTE
